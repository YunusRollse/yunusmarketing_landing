<title>Rahmat! Arizangiz qabul qilindi — Yunus Marketing</title>

<style>
  :root{--ink:#eaf3ee;--ink-soft:#b8d0c2;--paper:#050d09;--paper-2:#0b1a13;--muted:#8ea89a;--line:rgba(255,255,255,.08);
    --accent:#16a34a;--accent-line:rgba(22,163,74,.30);--glow:0 8px 30px -8px rgba(22,163,74,.55)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 500px at 50% -10%,rgba(22,163,74,.22),transparent 60%),var(--paper);
    min-height:100vh;display:flex;flex-direction:column}
  .top{padding:18px 24px;border-bottom:1px solid var(--line)}
  .logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
  main{flex:1;display:grid;place-items:center;padding:40px 20px}
  .card{max-width:520px;width:100%;text-align:center;background:linear-gradient(180deg,#12281c,#0a1712);
    border:1px solid var(--accent-line);border-radius:24px;padding:clamp(32px,6vw,52px) clamp(22px,5vw,44px)}
  .ic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 20px;box-shadow:0 0 30px rgba(22,163,74,.55)}
  h1{font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  p{color:var(--ink-soft);font-size:17px;font-weight:500;line-height:1.5;margin-top:12px}
  .alt{margin-top:26px;font-size:15px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:600;font-size:16px;padding:15px 26px;border-radius:12px;box-shadow:var(--glow)}
  .btn:hover{background:#22c55e}
  .back{display:inline-block;margin-top:18px;color:var(--muted);font-size:14px;text-decoration:none}
  .back:hover{color:var(--ink)}
  footer{padding:22px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
</style>
